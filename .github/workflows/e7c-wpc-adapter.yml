name: E7C WPC allocation adapter differential

on:
  pull_request:
    paths:
      - "research/e7c-0.1/adapters/wpc_allocation_b1.py"
      - "research/e7c-0.1/adapters/test_wpc_allocation_b1.py"
      - "research/e7c-0.1/adapters/wpc_unencoded_constitution_b1.py"
      - "research/e7c-0.1/adapters/test_wpc_unencoded_constitution_b1.py"
      - "research/e7c-0.1/E7C_0.1_WPC_UNENCODED_GATE.md"
      - "E7G-T_Kernel_v0.13_Experimental_Canonical_Draft.md"
      - "E7G-T_Kernel_v0.14_Experimental_Canonical_Draft.md"
      - "research/e7c-0.1/E7C_0.1_WP5_WPC_ALLOCATION_GATE.md"
      - "packages/wpc-0.2/**"
      - ".github/workflows/e7c-wpc-adapter.yml"
  push:
    branches:
      - "codex/e7c-wpc-allocation"
    paths:
      - "research/e7c-0.1/adapters/wpc_allocation_b1.py"
      - "research/e7c-0.1/adapters/test_wpc_allocation_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_WPC_ALLOCATION_GATE.md"
      - "packages/wpc-0.2/**"
      - ".github/workflows/e7c-wpc-adapter.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned WPC source checks
        run: python -m unittest discover -s packages/wpc-0.2 -p 'test_*.py' -v
      - name: WPC differential checks
        run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_wpc_*.py' -v
      - name: Compile selected adapter
        run: python -m compileall -q research/e7c-0.1/adapters/wpc_allocation_b1.py research/e7c-0.1/adapters/wpc_unencoded_constitution_b1.py
