name: E7C B2 explicit success sequencing

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7c_success_sequence_b2.py"
      - "research/e7c-0.1/e7c_success_sequence_checker_b2.py"
      - "research/e7c-0.1/e7_ir_success_sequence_b2.py"
      - "research/e7c-0.1/test_e7c_success_sequence_b2.py"
      - "research/e7c-0.1/test_e7_ir_success_sequence_b2.py"
      - "research/e7c-0.1/fixtures/wp5_ir/success_sequence*.json"
      - "research/e7c-0.1/E7C_B2_SUCCESS_SEQUENCE_GATE.md"
      - "research/e7c-0.1/E7C_0.1_CURRENT_STATE.md"
      - ".github/workflows/e7c-b2-success-sequence.yml"

permissions:
  contents: read

jobs:
  source-checker-ir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Success sequence and complete replay
        run: python -m unittest discover -s research/e7c-0.1 -p 'test_*success_sequence_b2.py' -v
