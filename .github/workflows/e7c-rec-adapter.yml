name: E7C REC replay adapter gate

on:
  pull_request:
    paths:
      - "research/e7c-0.1/adapters/rec_replay_b1.py"
      - "research/e7c-0.1/adapters/test_rec_replay_b1.py"
      - "research/e7c-0.1/adapters/rec_evidence_ir_b1.py"
      - "research/e7c-0.1/adapters/test_rec_evidence_ir_b1.py"
      - "research/e7c-0.1/E7C_0.1_REC_EVIDENCE_RULE_GATE.md"
      - "research/e7c-0.1/E7C_0.1_WP5_REC_REPLAY_GATE.md"
      - "packages/rec-0.1/**"
      - ".github/workflows/e7c-rec-adapter.yml"
  push:
    branches:
      - "codex/e7c-rec-replay"
    paths:
      - "research/e7c-0.1/adapters/rec_replay_b1.py"
      - "research/e7c-0.1/adapters/test_rec_replay_b1.py"
      - "research/e7c-0.1/adapters/rec_evidence_ir_b1.py"
      - "research/e7c-0.1/adapters/test_rec_evidence_ir_b1.py"
      - "research/e7c-0.1/E7C_0.1_REC_EVIDENCE_RULE_GATE.md"
      - "research/e7c-0.1/E7C_0.1_WP5_REC_REPLAY_GATE.md"
      - "packages/rec-0.1/**"
      - ".github/workflows/e7c-rec-adapter.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned REC source and checker tests
        run: python -m unittest discover -s packages/rec-0.1 -p 'test_*.py' -v
      - name: Bounded replay integration tests
        run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_rec_*.py' -v
      - name: Compile selected adapter
        run: python -m compileall -q research/e7c-0.1/adapters/rec_replay_b1.py research/e7c-0.1/adapters/rec_evidence_ir_b1.py
