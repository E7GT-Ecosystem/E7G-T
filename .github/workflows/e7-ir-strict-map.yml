name: E7-IR strict map finite replay

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7_ir_strict_map_b1.py"
      - "research/e7c-0.1/test_e7_ir_strict_map_b1.py"
      - "research/e7c-0.1/fixtures/wp5_ir/**"
      - "research/e7c-0.1/E7_IR_0.1_STRICT_MAP_GATE.md"
      - "research/e7c-0.1/e7_ir_var_b1.py"
      - "research/e7c-0.1/e7c_b1_evaluator.py"
      - "research/e7c-0.1/e7c_b1_replay_checker.py"
      - ".github/workflows/e7-ir-strict-map.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Strict map, replay and conventional control
        run: python -m unittest discover -s research/e7c-0.1 -p 'test_e7_ir_strict_map_b1.py' -v
