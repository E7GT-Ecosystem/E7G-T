name: E7C S1 finite dynamic replay

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7c_s1_*.py"
      - "research/e7c-0.1/test_s1_dynamic_replay.py"
      - "research/e7c-0.1/test_s1_strict_union.py"
      - "research/e7c-0.1/test_s1_source_correspondence.py"
      - "research/e7c-0.1/E7C_0.1_S1_DYNAMIC_REPLAY.md"
      - "research/e7c-0.1/E7C_0.1_S1_STRICT_JOINT.md"
      - "research/e7c-0.1/E7C_0.1_S1_CORRESPONDENCE_GATE.md"
      - ".github/workflows/e7c-s1-dynamic.yml"
  push:
    branches:
      - "codex/e7c-s1-dynamic-replay"
      - "codex/e7c-s1-strict-joint"
      - "codex/e7c-s1-correspondence"
    paths:
      - "research/e7c-0.1/e7c_s1_*.py"
      - "research/e7c-0.1/test_s1_dynamic_replay.py"
      - "research/e7c-0.1/test_s1_strict_union.py"
      - "research/e7c-0.1/test_s1_source_correspondence.py"
      - "research/e7c-0.1/E7C_0.1_S1_DYNAMIC_REPLAY.md"
      - "research/e7c-0.1/E7C_0.1_S1_STRICT_JOINT.md"
      - "research/e7c-0.1/E7C_0.1_S1_CORRESPONDENCE_GATE.md"
      - ".github/workflows/e7c-s1-dynamic.yml"

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python E7G-T_v0.12_Executable_Examples.py
      - run: python -m unittest discover -s research/e7c-0.1 -p 'test_s1*.py'
      - run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_*.py'
      - run: python -m compileall -q research/e7c-0.1/e7c_s1_*.py
