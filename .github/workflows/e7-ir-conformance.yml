name: E7-IR cross-slice conformance

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7_ir_conformance_b1.py"
      - "research/e7c-0.1/test_e7_ir_conformance_b1.py"
      - "research/e7c-0.1/fixtures/wp5_ir/**"
      - "research/e7c-0.1/E7_IR_CROSS_SLICE_CONFORMANCE_GATE.md"
      - "research/e7c-0.1/E7C_0.1_CURRENT_STATE.md"
      - ".github/workflows/e7-ir-conformance.yml"

permissions:
  contents: read

jobs:
  five-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Rebuild and replay finite cross-slice manifest
        run: python -m unittest discover -s research/e7c-0.1 -p 'test_e7_ir_conformance_b1.py' -v
