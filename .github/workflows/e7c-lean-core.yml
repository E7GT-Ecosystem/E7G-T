      - "research/e7c-0.1/*dict_aggregation_capture*"
      - "research/e7c-0.1/E7C_0.1_JOINT_DICTIONARY_LEAN_LINK.md"
      - "research/e7c-0.1/E7C_0.1_IR_OBSERVATION_CHECKER.md"
      - ".github/workflows/e7c-lean-core.yml"
  push:
    branches:
      - "codex/e7c-01-wp4-lean-core"
      - "codex/e7c-s1-lean-strict"
      - "codex/e7c-first-stage-admission-host-bridge-*"
      - "codex/e7c-joint-dictionary-aggregation-*"
      - "codex/e7c-joint-dictionary-lean-link-*"
    paths:
      - "research/e7c-0.1/proof-packages/lean-core/**"
      - "research/e7c-0.1/E7C_0.1_WP4_LEAN_CORE.md"
