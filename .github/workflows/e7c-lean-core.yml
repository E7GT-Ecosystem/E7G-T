name: E7C Lean core extension

on:
  pull_request:
    paths:
      - "research/e7c-0.1/proof-packages/lean-core/**"
      - "research/e7c-0.1/E7C_0.1_WP4_LEAN_CORE.md"
      - "research/e7c-0.1/E7C_0.1_S1_LEAN_STRICT_CORE.md"
      - "research/e7c-0.1/E7C_0.1_PROOF_ASSISTANT_SELECTION.md"
      - "research/e7c-0.1/E7C_0.1_CURRENT_STATE.md"
      - "research/e7c-0.1/E7C_0.1_RAW_JSON_EXTENSIONAL_EQUALITY.md"
      - "research/e7c-0.1/E7C_0.1_CPYTHON_STATEMENT_TRACE.md"
      - "research/e7c-0.1/test_wp4_metatheory.py"
      - ".github/workflows/e7c-lean-core.yml"
  push:
    branches:
      - "codex/e7c-01-wp4-lean-core"
      - "codex/e7c-s1-lean-strict"
    paths:
      - "research/e7c-0.1/proof-packages/lean-core/**"
      - "research/e7c-0.1/E7C_0.1_WP4_LEAN_CORE.md"
      - "research/e7c-0.1/E7C_0.1_S1_LEAN_STRICT_CORE.md"
      - "research/e7c-0.1/E7C_0.1_PROOF_ASSISTANT_SELECTION.md"
      - "research/e7c-0.1/E7C_0.1_CURRENT_STATE.md"
      - "research/e7c-0.1/E7C_0.1_RAW_JSON_EXTENSIONAL_EQUALITY.md"
      - "research/e7c-0.1/test_wp4_metatheory.py"
      - ".github/workflows/e7c-lean-core.yml"

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Focused pinned Joint operation and admission source tests
        run: |
          PYTHONPATH=research/e7c-0.1/adapters python3 research/e7c-0.1/test_e7c_joint_sort_constructor_semantics.py
          PYTHONPATH=research/e7c-0.1/adapters python3 research/e7c-0.1/test_e7c_joint_raw_json_admission.py
          PYTHONPATH=research/e7c-0.1/adapters:research/e7c-0.1 python3 -m unittest discover -s research/e7c-0.1 -p 'test_e7c_joint_first_helper_sites.py'
          PYTHONPATH=research/e7c-0.1/adapters:research/e7c-0.1 python3 -m unittest discover -s research/e7c-0.1 -p 'test_e7c_joint_admission_translation.py'
          PYTHONPATH=research/e7c-0.1/adapters:research/e7c-0.1 python3 -m unittest discover -s research/e7c-0.1 -p 'test_e7c_edition_source_audit.py'
      - uses: leanprover/lean-action@50fcf42d2e460296f1a34b402e990d1b24f8b596 # v1
        with:
          lake-package-directory: research/e7c-0.1/proof-packages/lean-core
          auto-config: false
          build: true
          axiom-audit: true
          axiom-audit-allow: "propext,Quot.sound"
          axiom-audit-root: E7CLeanCore
