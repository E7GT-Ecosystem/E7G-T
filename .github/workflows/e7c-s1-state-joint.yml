name: E7C S1 state and joint static candidate

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7c_s1_state_joint_static.py"
      - "research/e7c-0.1/test_s1_state_joint_static.py"
      - "research/e7c-0.1/E7C_0.1_S1_STATE_JOINT_STATIC.md"
      - ".github/workflows/e7c-s1-state-joint.yml"
  push:
    branches:
      - "codex/e7c-s1-state-joint"
    paths:
      - "research/e7c-0.1/e7c_s1_state_joint_static.py"
      - "research/e7c-0.1/test_s1_state_joint_static.py"
      - "research/e7c-0.1/E7C_0.1_S1_STATE_JOINT_STATIC.md"
      - ".github/workflows/e7c-s1-state-joint.yml"

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s research/e7c-0.1 -p 'test_*.py'
      - run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_*.py'
