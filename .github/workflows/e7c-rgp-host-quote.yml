name: E7C RGP quoted host and local view

on:
  pull_request:
    paths:
      - "research/e7c-0.1/adapters/rgp_finite_b1.py"
      - "research/e7c-0.1/adapters/test_rgp_host_quote_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_RGP_HOST_QUOTE_GATE.md"
      - ".github/workflows/e7c-rgp-host-quote.yml"
  push:
    branches:
      - "codex/e7c-rgp-host-quote"
    paths:
      - "research/e7c-0.1/adapters/rgp_finite_b1.py"
      - "research/e7c-0.1/adapters/test_rgp_host_quote_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_RGP_HOST_QUOTE_GATE.md"
      - ".github/workflows/e7c-rgp-host-quote.yml"

permissions:
  contents: read

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned RGP source and finite adapter checks
        run: python -m unittest -q test_e7gt_rgp_v0_1.py && python -m unittest discover -s research/e7c-0.1/adapters -p 'test_rgp_*b1.py' -v
