name: E7C EEC-Q correlated Joint IR

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7c_eecq_joint_restrict_b1.py"
      - "research/e7c-0.1/e7_ir_eecq_joint_restrict_b1.py"
      - "research/e7c-0.1/test_e7_ir_eecq_joint_restrict_b1.py"
      - "research/e7c-0.1/fixtures/wp5_ir/eecq_correlated_joint_restrict.json"
      - "research/e7c-0.1/adapters/eec_q_fg3_joint_b1.py"
      - "research/e7c-0.1/E7C_0.1_CURRENT_STATE.md"
      - "research/e7c-0.1/E7C_0.1_WP5_IR_INTEGRATION_MATRIX.md"
      - "research/e7c-0.1/E7C_0.1_WP5_EECQ_JOINT_IR_GATE.md"
      - ".github/workflows/e7c-eecq-joint-ir.yml"

permissions:
  contents: read

jobs:
  joint-ir-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Correlation, explicit exclusion, rational baseline and replay
        run: PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7_ir_eecq_joint_restrict_b1 -v
      - name: Existing FG3 joint differential
        run: PYTHONPATH=research/e7c-0.1/adapters python -m unittest test_eec_q_fg3_joint_b1 -v
