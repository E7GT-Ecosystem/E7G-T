name: E7C EEC-Q two-stage Joint restriction

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7c_eecq_two_stage_b1.py"
      - "research/e7c-0.1/e7_ir_eecq_two_stage_b1.py"
      - "research/e7c-0.1/e7c_eecq_two_stage_lean_bridge.py"
      - "research/e7c-0.1/test_e7_ir_eecq_two_stage_b1.py"
      - "research/e7c-0.1/test_e7c_eecq_two_stage_lean_bridge.py"
      - "research/e7c-0.1/test_e7c_eecq_two_stage_all_input.py"
      - "research/e7c-0.1/test_e7c_eecq_two_stage_operational.py"
      - "research/e7c-0.1/e7c_eecq_two_stage_exact_codec.py"
      - "research/e7c-0.1/test_e7c_eecq_two_stage_exact_codec.py"
      - "research/e7c-0.1/e7c_eecq_two_stage_transition_certificate.py"
      - "research/e7c-0.1/test_e7c_eecq_two_stage_transition_certificate.py"
      - "research/e7c-0.1/e7c_eecq_two_stage_transition_site_audit.py"
      - "research/e7c-0.1/test_e7c_eecq_two_stage_transition_site_audit.py"
      - "research/e7c-0.1/e7c_joint_control_flow_pin.py"
      - "research/e7c-0.1/test_e7c_joint_control_flow_pin.py"
      - "research/e7c-0.1/test_e7c_joint_first_code_boundary.py"
      - "research/e7c-0.1/E7C_0.1_JOINT_ACTUAL_CODE_PROOF_GATE.md"
      - "research/e7c-0.1/E7C_0.1_EECQ_TRANSITION_SITE_AUDIT_GATE.md"
      - "research/e7c-0.1/E7C_0.1_EECQ_TWO_STAGE_IMPLEMENTATION_PATH_GATE.md"
      - "research/e7c-0.1/E7C_0.1_EECQ_TWO_STAGE_EXACT_CODEC_GATE.md"
      - "research/e7c-0.1/E7C_0.1_EECQ_TWO_STAGE_ALL_INPUT_GATE.md"
      - "research/e7c-0.1/E7C_0.1_EECQ_TWO_STAGE_OPERATIONAL_GATE.md"
      - "research/e7c-0.1/fixtures/wp5_ir/eecq_two_stage*.json"
      - "research/e7c-0.1/E7C_0.1_WP5_EECQ_TWO_STAGE_GATE.md"
      - ".github/workflows/e7c-eecq-two-stage.yml"

permissions:
  contents: read

jobs:
  source-ir-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Two-stage conservation, failure, limits and generated bridge
        run: |
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7_ir_eecq_two_stage_b1 -v
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7c_eecq_two_stage_lean_bridge -v
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7c_eecq_two_stage_all_input -v
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7c_eecq_two_stage_operational -v
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7c_eecq_two_stage_exact_codec -v
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7c_eecq_two_stage_transition_certificate -v
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7c_eecq_two_stage_transition_site_audit -v
          PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7c_joint_control_flow_pin test_e7c_joint_first_code_boundary -v
      - name: First stage regression
        run: PYTHONPATH=research/e7c-0.1:research/e7c-0.1/adapters python -m unittest test_e7_ir_eecq_joint_restrict_b1 -v
