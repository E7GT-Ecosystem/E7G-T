name: E7-IR finite views and loss boundary

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7_ir_views_b1.py"
      - "research/e7c-0.1/test_e7_ir_views_b1.py"
      - "research/e7c-0.1/fixtures/wp5_ir/**"
      - "research/e7c-0.1/E7_IR_0.2_VIEWS_GATE.md"
      - "research/e7c-0.1/E7C_0.1_CURRENT_STATE.md"
      - "research/e7c-0.1/e7c_b1_evaluator.py"
      - "research/e7c-0.1/e7c_b1_replay_checker.py"
      - ".github/workflows/e7-ir-views.yml"

permissions:
  contents: read

jobs:
  finite-views:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Replay, loss and source-token differential
        run: python -m unittest discover -s research/e7c-0.1 -p 'test_e7_ir_views_b1.py' -v
