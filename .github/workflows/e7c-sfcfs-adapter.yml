name: E7C SF CFS finite point differential

on:
  pull_request:
    paths:
      - "research/e7c-0.1/adapters/sfcfs_points_b1.py"
      - "research/e7c-0.1/adapters/test_sfcfs_points_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_SFCFS_POINTS_GATE.md"
      - "E7G-T_Combined_Family_State_v0.1.py"
      - "E7G-T_Symbolic_Families_v0.1.py"
      - ".github/workflows/e7c-sfcfs-adapter.yml"
  push:
    branches:
      - "codex/e7c-sfcfs-points"
    paths:
      - "research/e7c-0.1/adapters/sfcfs_points_b1.py"
      - "research/e7c-0.1/adapters/test_sfcfs_points_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_SFCFS_POINTS_GATE.md"
      - "E7G-T_Combined_Family_State_v0.1.py"
      - "E7G-T_Symbolic_Families_v0.1.py"
      - ".github/workflows/e7c-sfcfs-adapter.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Source CFS checks
        run: python E7G-T_Combined_Family_State_v0.1.py
      - name: Bounded finite point differential
        run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_sfcfs_*.py' -v
      - name: Compile selected adapter
        run: python -m compileall -q research/e7c-0.1/adapters/sfcfs_points_b1.py
