name: E7C temporal finite adapter gate

on:
  pull_request:
    paths:
      - "research/e7c-0.1/adapters/temporal_history_b1.py"
      - "research/e7c-0.1/adapters/test_temporal_history_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_TEMPORAL_HISTORY_GATE.md"
      - "E7G-T_Kernel_v0.12.1_Experimental_Canonical_Reference.md"
      - ".github/workflows/e7c-temporal-adapter.yml"
  push:
    branches:
      - "codex/e7c-temporal-finite"
    paths:
      - "research/e7c-0.1/adapters/temporal_history_b1.py"
      - "research/e7c-0.1/adapters/test_temporal_history_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_TEMPORAL_HISTORY_GATE.md"
      - "E7G-T_Kernel_v0.12.1_Experimental_Canonical_Reference.md"
      - ".github/workflows/e7c-temporal-adapter.yml"

permissions:
  contents: read

jobs:
  finite-history:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Finite temporal history tests
        run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_temporal_*.py' -v
      - name: Compile selected adapter
        run: python -m compileall -q research/e7c-0.1/adapters/temporal_history_b1.py
