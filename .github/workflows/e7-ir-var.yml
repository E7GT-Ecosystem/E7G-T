name: E7-IR selected var differential

on:
  pull_request:
    paths:
      - "research/e7c-0.1/e7_ir_var_b1.py"
      - "research/e7c-0.1/test_e7_ir_var_b1.py"
      - "research/e7c-0.1/E7_IR_0.1_VAR_GATE.md"
      - ".github/workflows/e7-ir-var.yml"
  push:
    branches:
      - "codex/e7c-ir-var"
    paths:
      - "research/e7c-0.1/e7_ir_var_b1.py"
      - "research/e7c-0.1/test_e7_ir_var_b1.py"
      - "research/e7c-0.1/E7_IR_0.1_VAR_GATE.md"
      - ".github/workflows/e7-ir-var.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Selected source and IR differential
        run: python -m unittest discover -s research/e7c-0.1 -p 'test_e7_ir_var_b1.py' -v
      - name: Compile selected IR
        run: python -m compileall -q research/e7c-0.1/e7_ir_var_b1.py
