name: E7C derived relational separation gate

on:
  pull_request:
    paths:
      - "research/e7c-0.1/adapters/derived_nonseparability_b1.py"
      - "research/e7c-0.1/adapters/test_derived_nonseparability_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_DERIVED_SEPARATION_GATE.md"
      - "research/e7c-0.1/adapters/eec_q_fg3_*.py"
      - ".github/workflows/e7c-derived-separation.yml"
  push:
    branches:
      - "codex/e7c-nonseparable-derived"
    paths:
      - "research/e7c-0.1/adapters/derived_nonseparability_b1.py"
      - "research/e7c-0.1/adapters/test_derived_nonseparability_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_DERIVED_SEPARATION_GATE.md"
      - "research/e7c-0.1/adapters/eec_q_fg3_*.py"
      - ".github/workflows/e7c-derived-separation.yml"

permissions:
  contents: read

jobs:
  finite-derivation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Finite derived-library cases
        run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_derived_*.py' -v
      - name: Compile derived module
        run: python -m compileall -q research/e7c-0.1/adapters/derived_nonseparability_b1.py
