name: E7C MSC finite adapter differential

on:
  pull_request:
    paths:
      - "research/e7c-0.1/adapters/msc_finite_b1.py"
      - "research/e7c-0.1/adapters/test_msc_finite_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_MSC_FINITE_GATE.md"
      - "proposals/msc-0.1/**"
      - ".github/workflows/e7c-msc-adapter.yml"
  push:
    branches:
      - "codex/e7c-msc-finite"
    paths:
      - "research/e7c-0.1/adapters/msc_finite_b1.py"
      - "research/e7c-0.1/adapters/test_msc_finite_b1.py"
      - "research/e7c-0.1/E7C_0.1_WP5_MSC_FINITE_GATE.md"
      - "proposals/msc-0.1/**"
      - ".github/workflows/e7c-msc-adapter.yml"

permissions:
  contents: read

jobs:
  differential:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Pinned MSC source tests
        run: python -m unittest discover -s proposals/msc-0.1 -p 'test_*.py' -v
      - name: Bounded MSC differential tests
        run: python -m unittest discover -s research/e7c-0.1/adapters -p 'test_msc_*.py' -v
      - name: Compile selected adapter
        run: python -m compileall -q research/e7c-0.1/adapters/msc_finite_b1.py
